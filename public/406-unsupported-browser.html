<!doctype html>
<html lang="en">
  <head>
    <title>Browser not supported · Clempo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f5f7">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #f4f5f7;
        color: #1b1f27;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 24rem;
        background: #ffffff;
        border: 1px solid #e2e5ea;
        border-radius: 14px;
        padding: 32px 24px;
      }
      .brand { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 24px; }
      h1 { font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em; }
      p { color: #3a4150; margin-top: 8px; }
      a.button {
        display: block;
        margin-top: 24px;
        padding: 12px 24px;
        border-radius: 10px;
        background: #2f5bb0;
        color: #ffffff;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
      }
      a.button:hover { filter: brightness(0.95); }
      a.button:focus-visible { outline: 2px solid #2f5bb0; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Clempo</div>
      <h1>This browser is too old for Clempo.</h1>
      <p>Please update your browser, or open Clempo in a recent version of Safari, Chrome, Edge or Firefox.</p>
    </main>
  </body>
</html>
